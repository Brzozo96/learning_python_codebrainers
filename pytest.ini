[pytest]
addopts = -vs
markers =
    dodaj: test dodawania
    odejmij: test odejmowania
    pomnoz: test mnożenia
    podziel: test dzielenia
    dodaj_z_parametrami: test dodawania z parametryzacja
    powitanie: test powitania
    dodaj_z_fixture: test dodawania z fixture
    zadanie_z_fixture: test dodawania z fixture
